plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'org.sappari.air_visualizer'
    compileSdk 35
    defaultConfig {
        applicationId 'org.sappari.air_visualizer.s25'
        minSdk 30
        targetSdk 35
        versionCode 4
        versionName '0.3.0-s25-preview'
        ndk { abiFilters 'arm64-v8a' }
    }
    // Local release distribution retains the installed preview's certificate.
    // A store publication needs an independently managed upload/release key.
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug } }
    testOptions {
        unitTests.all {
            def hostOpenCv = System.getenv('FLOW_OPENCV_DLL')
            if (hostOpenCv) systemProperty 'flow.opencv.dll', hostOpenCv
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { viewBinding true }
    packaging { jniLibs { useLegacyPackaging = false } }
}
dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'org.opencv:opencv:4.12.0'
    implementation 'androidx.camera:camera-core:1.4.2'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    testImplementation 'junit:junit:4.13.2'
}
